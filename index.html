<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Quién quiere ser Leonardo?</title>
<style>
  :root{
    --blau-fosc:#0a1030;
    --blau-mig:#1a2a6b;
    --or:#f5c542;
    --vermell:#d0342c;
    --taronja:#e8801a;
    --text:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);
    background:radial-gradient(circle at 50% 0%,#233a8f 0%,var(--blau-mig) 45%,var(--blau-fosc) 100%);
    min-height:100vh;
  }
  #app{max-width:1200px;margin:0 auto;padding:16px;}
  h1{font-size:2rem;text-align:center;color:var(--or);text-shadow:0 2px 6px #000;margin:.3em 0;}
  h1 small{display:block;font-size:1rem;color:#cfd6ff;font-weight:normal;}
  .botons-menu{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:24px auto;}
  .btn{
    font:inherit;font-size:1.15rem;font-weight:bold;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,#2a3f9e,#16235f);
    border:2px solid var(--or);border-radius:12px;padding:14px 20px;
    transition:transform .08s,background .15s;
  }
  .btn:hover{transform:scale(1.02);background:#31499f;}
  .btn.secundari{border-color:#7d8ac9;}
  .btn.perill{border-color:var(--vermell);background:linear-gradient(180deg,#a02a24,#5e170f);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-petit{font-size:.95rem;padding:6px 12px;}
  .fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .columna-joc{display:flex;gap:18px;align-items:flex-start;}
  .zona-pregunta{flex:1;min-width:0;}
  .escala-zona{width:250px;flex-shrink:0;}
  @media (max-width:820px){
    .columna-joc{flex-direction:column-reverse;}
    .escala-zona{width:100%;}
  }
  .capsalera-joc{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;
    background:rgba(0,0,20,.4);border:1px solid #3c4a9a;border-radius:12px;padding:10px 14px;margin-bottom:14px;
  }
  .guanyactual{font-size:1.3rem;color:var(--or);font-weight:bold;}
  .comodins{display:flex;gap:8px;}
  .comodi{
    font:inherit;font-weight:bold;cursor:pointer;border-radius:50%;
    width:58px;height:58px;font-size:.9rem;color:#fff;
    background:radial-gradient(circle at 30% 30%,#4c62c9,#1a2470);
    border:3px solid var(--or);
  }
  .comodi.usat{opacity:.25;text-decoration:line-through;cursor:not-allowed;border-color:#666;}
  .targeta-pregunta{
    background:linear-gradient(180deg,#1b2a77,#0d1740);
    border:2px solid var(--or);border-radius:16px;
    padding:22px;text-align:center;font-size:1.35rem;line-height:1.4;margin-bottom:18px;
  }
  .num-pregunta{color:var(--or);font-size:1rem;margin-bottom:8px;font-weight:bold;}
  .opcions{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){.opcions{grid-template-columns:1fr;}}
  .opcio{
    display:flex;align-items:center;gap:12px;font:inherit;font-size:1.15rem;text-align:left;color:#fff;
    background:linear-gradient(180deg,#233a8f,#111c55);
    border:2px solid #5a6bc4;border-radius:12px;padding:12px 16px;cursor:pointer;
  }
  .opcio:hover{border-color:var(--or);}
  .lletra{
    font-weight:bold;color:var(--or);border:2px solid var(--or);border-radius:50%;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .opcio.triada{border-color:var(--taronja);background:#7a4a10;}
  .opcio.correcta{border-color:#3ddc6b;background:#1c5e30;}
  .opcio.error{border-color:var(--vermell);background:#6e1d18;}
  .opcio.oculta{visibility:hidden;}
  .opcio:disabled{cursor:not-allowed;}
  .panell-controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;justify-content:center;}
  .panell-controls .btn{font-size:1.05rem;padding:10px 16px;}
  #temporitzador{
    font-size:2.6rem;font-weight:bold;color:var(--vermell);text-align:center;
    display:none;margin:10px 0;text-shadow:0 2px 8px #000;
  }
  .panell-flotant{
    position:fixed;right:18px;top:88px;width:310px;max-width:calc(100vw - 24px);z-index:60;
    background:var(--blau-mig);border:3px solid var(--or);border-radius:16px;
    box-shadow:0 12px 32px rgba(0,0,10,.65);max-height:calc(100vh - 110px);overflow:auto;
  }
  .panell-flotant.ocult{display:none;}
  .panell-cap{
    cursor:move;user-select:none;touch-action:none;
    background:rgba(0,0,30,.6);color:var(--or);font-weight:bold;
    padding:10px 12px;border-radius:12px 12px 0 0;font-size:1rem;
  }
  .panell-cos{padding:12px 14px 16px;}
  .panell-cos p{margin:0 0 10px;font-size:.95rem;color:#cfd6ff;}
  .fila-entrada{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .fila-entrada input{flex:1;font:inherit;padding:8px 10px;min-width:0;
    border-radius:8px;border:2px solid #5a6bc4;background:#0b1238;color:#fff;}
  .fila-entrada input:focus{outline:none;border-color:var(--or);}
  .grafic-publi{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
  .barra-fila{display:flex;align-items:center;gap:10px;font-weight:bold;}
  .barra-fila .lletra{width:28px;height:28px;font-size:.9rem;}
  .barra-contenidor{flex:1;background:#0b1238;border:1px solid #5a6bc4;border-radius:8px;height:26px;overflow:hidden;}
  .barra{height:100%;background:linear-gradient(90deg,var(--or),#fff2c0);width:0;}
  .pct{width:48px;text-align:right;}
  .resultat-final{
    text-align:center;font-size:1.4rem;margin:20px auto;max-width:640px;
    border:2px solid var(--or);border-radius:16px;padding:26px;
  }
  .editor-zona{max-width:820px;margin:0 auto;}
  .camp{display:block;width:100%;font:inherit;padding:9px 12px;margin:6px 0 12px;
    border-radius:8px;border:2px solid #5a6bc4;background:#0b1238;color:#fff;}
  .camp:focus{outline:none;border-color:var(--or);}
  label{font-weight:bold;color:#cfd6ff;}
  .radio-correcta{margin-right:6px;transform:scale(1.3);}
  .item-pregunta{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:rgba(0,0,30,.5);border:1px solid #3c4a9a;border-radius:10px;
    padding:10px 14px;margin-bottom:8px;
  }
  .item-pregunta span{flex:1;}
  .aviso{
    background:#4a3a10;border:1px solid var(--or);border-radius:10px;
    padding:12px 16px;margin:12px auto;max-width:640px;font-size:1.05rem;text-align:center;
  }
  .ajuda{max-width:760px;margin:0 auto;font-size:1.1rem;line-height:1.6;}
  .ajuda li{margin-bottom:8px;}
  .tornar{margin-top:20px;text-align:center;}
  #peu{
    display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;
    margin:28px 16px 30px;padding:12px 16px;
    background:rgba(255,255,255,.08);border-radius:12px;font-size:.95rem;color:#cfd6ff;
  }
  #peu .peu-text{font-weight:bold;}
  #peu .logo-collab{height:54px;border-radius:6px;background:#fff;padding:4px;}
  .badge-upc{
    height:54px;display:flex;align-items:center;justify-content:center;
    border:2px solid #fff;border-radius:8px;padding:4px 16px;
    font-weight:bold;color:#fff;letter-spacing:2px;font-size:.85rem;white-space:nowrap;
  }
  .badge-upc b{font-size:1.35rem;letter-spacing:0;margin-left:8px;}
  .mascota{display:block;margin:0 auto 14px;max-width:330px;width:72%;
    border-radius:14px;box-shadow:0 8px 24px rgba(0,0,40,.5);}
</style>
</head>

var estat = {
  vista:"inici",          // inici | joc | final | editor | edicio-pregunta | ajuda
  mode:null,              // presentador | concursant
  concursant:0,
  nivell:0,
  guany:0,
  triada:null,
  confirmat:false,
  eliminades:[],
  comodins:{cincuenta:true,publi:true,google:true},
  veientCorrecta:false,
  temporitzadorRestant:0,
  missatge:""
};
var editorEstat = { concursant:0, index:null };
var votesTemp = [0,0,0,0];
var intervalTemp = null;

var app = document.getElementById("app");

/* ---------------- PREGUNTES ---------------- */
var preguntesPerConcursant = carregarPreguntes();

function carregarPreguntes() {
  var dades = null;
  try { dades = JSON.parse(localStorage.getItem(CLAU_EMMAGATZEMATGE)); } catch (e) { dades = null; }
  if (!dades || typeof dades !== "object") dades = {};
  return {
    c1: Array.isArray(dades.c1) && dades.c1.length ? dades.c1 : null,
    c2: Array.isArray(dades.c2) ? dades.c2 : null,
    c3: Array.isArray(dades.c3) ? dades.c3 : null
  };
}

function preguntesDe(n) {
  if (n === 0) return preguntesPerConcursant.c1 || PREGUNTES_C1;
  return preguntesPerConcursant["c" + (n + 1)] || (n === 1 ? PREGUNTES_C2 : PREGUNTES_C3);
}

function guardarPreguntes() {
  var dades = { c1: preguntesPerConcursant.c1, c2: preguntesPerConcursant.c2, c3: preguntesPerConcursant.c3 };
  try { localStorage.setItem(CLAU_EMMAGATZEMATGE, JSON.stringify(dades)); } catch (e) {}
}

function preguntaActual() {
  return preguntesDe(estat.concursant)[estat.nivell] || null;
}

function premiAssegurat() {
  if (estat.nivell > NIVELL_ASSEGURAT_2) return PREMIS[NIVELL_ASSEGURAT_2];
  if (estat.nivell > NIVELL_ASSEGURAT_1) return PREMIS[NIVELL_ASSEGURAT_1];
  return 0;
}

function formatEuro(n) { return n.toLocaleString("ca-ES") + " €"; }

function escapar(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------------- TEMPORITZADOR GOOGLE (30 s) ---------------- */
function iniciarTemporitzador() {
  aturarTemporitzador();
  estat.temporitzadorRestant = 30;
  pintarTemporitzador();
  intervalTemp = setInterval(function () {
    estat.temporitzadorRestant--;
    pintarTemporitzador();
    if (estat.temporitzadorRestant <= 0) {
      aturarTemporitzador();
      estat.temporitzadorRestant = 0;
      pintarTemporitzador();
      estat.missatge = "S'han acabat els 30 segons de Google!";
      renderitzar();
    }
  }, 1000);
}
function aturarTemporitzador() {
  if (intervalTemp) { clearInterval(intervalTemp); intervalTemp = null; }
  estat.temporitzadorRestant = 0;
  pintarTemporitzador();
}
function pintarTemporitzador() {
  var el = document.getElementById("temporitzador");
  if (!el) return;
  el.textContent = "Google: " + estat.temporitzadorRestant + " s";
  el.style.display = estat.temporitzadorRestant > 0 ? "block" : "none";
}

/* ---------------- MODAL PÚBLIC ---------------- */
function obrirPublic() {
  votesTemp = [0,0,0,0];
  var contenidor = document.getElementById("inputsPubli");
  contenidor.innerHTML = "";
  LLETRES.forEach(function (l, i) {
    var fila = document.createElement("div");
    fila.className = "fila-entrada";
    fila.innerHTML = '<span class="lletra">' + l + '</span>';
    var entrada = document.createElement("input");
    entrada.type = "number"; entrada.min = "0"; entrada.value = "0";
    entrada.setAttribute("aria-label", "Vots de la resposta " + l);
    entrada.addEventListener("input", function () {
      votesTemp[i] = Math.max(0, parseInt(entrada.value, 10) || 0);
    });
    fila.appendChild(entrada);
    contenidor.appendChild(fila);
  });
  document.getElementById("graficPubli").innerHTML = "";
  var panell = document.getElementById("panellPubli");
  panell.classList.remove("ocult");
  panell.style.right = "18px";
  panell.style.top = "88px";
  panell.style.left = "auto";
}
function ferGraficPublic() {
  var total = votesTemp.reduce(function (a, b) { return a + b; }, 0);
  var grafic = document.getElementById("graficPubli");
  grafic.innerHTML = "";
  LLETRES.forEach(function (l, i) {
    var pct = total > 0 ? Math.round(100 * votesTemp[i] / total) : 0;
    var fila = document.createElement("div");
    fila.className = "barra-fila";
    fila.innerHTML = '<span class="lletra">' + l + '</span>' +
      '<div class="barra-contenidor"><div class="barra" style="width:' + pct + '%"></div></div>' +
      '<span class="pct">' + pct + '%</span>';
    grafic.appendChild(fila);
  });
}

/* ---------------- ACCIONS DE JOC ---------------- */
function iniciarJoc() {
  if (preguntesDe(estat.concursant).length < 15) {
    estat.missatge = "Aquest concursant encara no té les 15 preguntes. Afegiu-les amb l'editor.";
    estat.vista = "inici";
    renderitzar();
    return;
  }
  estat.vista = "joc";
  reiniciarTorn();
  renderitzar();
}
function reiniciarTorn() {
  estat.nivell = 0;
  estat.guany = 0;
  estat.triada = null;
  estat.confirmat = false;
  estat.eliminades = [];
  estat.veientCorrecta = false;
  estat.missatge = "";
  estat.comodins = {cincuenta:true,publi:true,google:true};
  aturarTemporitzador();
}
function clicarOpcio(i) {
  if (estat.confirmat) return;
  estat.triada = (estat.triada === i) ? null : i;
  estat.missatge = "";
  renderitzar();
  window.scrollTo(0, 0);
}
function confirmarResposta() {
  var q = preguntaActual();
  if (!q || estat.triada === null) return;
  estat.confirmat = true;
  aturarTemporitzador();
  if (estat.triada === q.c) {
    estat.guany = PREMIS[estat.nivell];
    if (estat.nivell >= 14) {
      renderFinal(true);
      return;
    }
    if (estat.mode === "concursant") {
      setTimeout(seguentPregunta, 2200); // avança sola, sense botons de presentador
    }
  } else {
    estat.guany = premiAssegurat();
  }
  renderitzar();
}
function seguentPregunta() {
  var q = preguntaActual();
  if (!q || estat.triada !== q.c) { renderFinal(false); return; }
  if (estat.nivell >= 14) { renderFinal(true); return; }
  estat.nivell++;
  estat.triada = null;
  estat.confirmat = false;
  estat.eliminades = [];
  estat.veientCorrecta = false;
  estat.missatge = "";
  aturarTemporitzador();
  renderitzar();
}
function retirarSe() {
  estat.triada = null;
  estat.guany = estat.guany;
  estat.confirmat = true;
  renderFinal(true);
}
function usarCincuanta() {
  if (!estat.comodins.cincuenta || estat.confirmat) return;
  var q = preguntaActual();
  if (!q) return;
  var incorrectes = [0,1,2,3].filter(function (i) { return i !== q.c; });
  if (estat.triada !== null && estat.triada !== q.c) {
    // si la triada és incorrecta, conservem-la visible: en traiem les altres dues
    var altres = incorrectes.filter(function (i) { return i !== estat.triada; });
    estat.eliminades = altres;
  } else {
    while (incorrectes.length > 2) {
      incorrectes.splice(Math.floor(Math.random() * incorrectes.length), 1);
    }
    estat.eliminades = incorrectes;
  }
  estat.comodins.cincuenta = false;
  renderitzar();
}
function usarPubli() {
  if (!estat.comodins.publi || estat.confirmat) return;
  estat.comodins.publi = false;
  renderitzar();
  obrirPublic();
}
function usarGoogle() {
  if (!estat.comodins.google || estat.confirmat) return;
  estat.comodins.google = false;
  renderitzar();
  iniciarTemporitzador();
}
function commutarVeureCorrecta() {
  estat.veientCorrecta = !estat.veientCorrecta;
  renderitzar();
}

/* ---------------- RENDERITZACIÓ ---------------- */
function renderitzar() {
  switch (estat.vista) {
    case "inici": renderInici(); break;
    case "joc": renderJoc(); break;
    case "editor": renderEditor(); break;
    case "edicio-pregunta": renderEdicioPregunta(); break;
    case "ajuda": renderAjuda(); break;
  }
}

      '<button class="btn secundari" data-accio="anar-editor">✏️ Editor de preguntes</button>' +
      '<button class="btn secundari" data-accio="anar-ajuda">❓ Com es juga</button>' +
    '</div>' +
    '<div id="menuConcursant" style="display:none;">' +
      '<p style="text-align:center;font-size:1.2rem;">Tria el concursant (màxim 3):</p>' +
      '<div class="botons-menu" style="margin-top:6px;">' + botoConcursants + '</div>' +
    '</div>';
}

function renderJoc() {
  var q = preguntaActual();
  var esPres = estat.mode === "presentador";
  var html = '<h1>¿Quién quiere ser Leonardo?<small>' +
    (esPres ? "Modo presentador · " : "Modo concursant · ") +
    escapar(NOMS_CONCURSANTS[estat.concursant]) + '</small></h1>';

  html += '<div class="capsalera-joc">' +
    '<div class="comodins">' +
      '<button class="comodi' + (estat.comodins.cincuenta ? '' : ' usat') + '" id="btn50" title="50:50 (el fa el presentador)">50:50</button>' +
      '<button class="comodi' + (estat.comodins.publi ? '' : ' usat') + '" id="btnComodiPubli" title="Públic">👥</button>' +
      '<button class="comodi' + (estat.comodins.google ? '' : ' usat') + '" id="btnComodiGoogle" title="30 segons amb Google">G</button>' +
    '</div>' +
    '<div class="guanyactual">Guany: ' + formatEuro(estat.guany) + '</div>' +
    '<button class="btn secundari btn-petit" data-accio="tornar-inici" title="Tornar al menú inicial">⬅ Menú</button>' +
  '</div>';

  html += '<div class="columna-joc"><div class="zona-pregunta">' +
    '<div id="temporitzador"></div>' +
    '<div class="targeta-pregunta"><div class="num-pregunta">Pregunta ' + (estat.nivell + 1) + ' de 15 · val ' +
      formatEuro(PREMIS[estat.nivell]) +
      (estat.nivell === NIVELL_ASSEGURAT_1 || estat.nivell === NIVELL_ASSEGURAT_2
        ? ' · <strong>nivell assegurat!</strong>' : '') +
    '</div>' + escapar(q.p) + '</div>' +
    '<div class="opcions">';

  LLETRES.forEach(function (l, i) {
    var classes = "opcio";
    if (estat.eliminades.indexOf(i) >= 0) classes += " oculta";
    var correcta = (i === q.c);
    if (estat.confirmat) {
      if (correcta) classes += " correcta";
      else if (estat.triada === i) classes += " error";
    } else {
      if (estat.triada === i) classes += " triada";
      else if (estat.veientCorrecta && correcta) classes += " correcta";
    }
    html += '<button class="' + classes + '" data-accio="opcio" data-i="' + i + '"' +
      (estat.confirmat || estat.eliminades.indexOf(i) >= 0 || (estat.mode === "concursant" && estat.confirmat) ? ' disabled' : '') +
      '><span class="lletra">' + l + '</span><span>' + escapar(q.o[i]) + '</span></button>';
  });
  html += '</div>';

  html += '<div class="panell-controls">';
  if (!estat.confirmat) {
    if (esPres) {
      html += '<button class="btn" id="btnConfirmar"' + (estat.triada === null ? ' disabled' : '') +
        '>✅ Confirmar la resposta del concursant (' + (estat.triada !== null ? LLETRES[estat.triada] : '—') + ')</button>' +
        '<button class="btn secundari" id="btnVeure">👁️ ' + (estat.veientCorrecta ? "Ocultar la correcta" : "Veure la correcta (només presentador)") + '</button>';
    } else {
      html += '<button class="btn" id="btnConfirmar"' + (estat.triada === null ? ' disabled' : '') +
        '>✅ Confirmar la meva resposta</button>';
    }
    html += '<button class="btn perill" id="btnRetirar">🏳️ Aturar-se i marxar amb ' + formatEuro(estat.guany) + '</button>';
  } else if (estat.triada === q.c) {
    html += '<div class="aviso" style="width:100%;">🎉 Correcte! Ja tens assegurada la quantitat: <strong>' + formatEuro(estat.guany) + '</strong></div>';
    if (esPres) html += '<button class="btn" id="btnSeguent">➡️ Següent pregunta (' + formatEuro(PREMIS[estat.nivell + 1]) + ')</button>';
  } else {
    html += '<div class="aviso" style="width:100%;">🛑 No era la bona: la resposta correcta era la ' + LLETRES[q.c] + '. El premi assegurat es conserva: <strong>' + formatEuro(estat.guany) + '</strong></div>';
    html += '<button class="btn perill" id="btnSeguent">🛑 Veure el resultat final</button>';
  }
  html += '</div></div>';

  html += '<div class="escala-zona"><table class="taula-escala">';
  for (var n = 14; n >= 0; n--) {
    var fila = "fila-escala";
    if (n === estat.nivell) fila += " fila-actual";
    else if (n < estat.nivell) fila += " fila-superada";
    if (n === NIVELL_ASSEGURAT_1 || n === NIVELL_ASSEGURAT_2) fila += " fila-assegurat";
    html += '<tr class="' + fila.trim() + '"><td>' + (n + 1) + '</td><td class="premi">' + formatEuro(PREMIS[n]) + '</td></tr>';
  }
  html += '</table></div></div>';

  app.innerHTML = html;
  pintarTemporitzador();
  lligarJoc();
}
function lligarJoc() {
 [].forEach.call(document.querySelectorAll("[data-accio='opcio']"), function (b) {
    b.addEventListener("click", function () { clicarOpcio(parseInt(b.getAttribute("data-i"), 10)); });
  });
  lligar("btn50", usarCincuanta);
  lligar("btnComodiPubli", usarPubli);
  lligar("btnComodiGoogle", usarGoogle);
  lligar("btnConfirmar", confirmarResposta);
  lligar("btnVeure", commutarVeureCorrecta);
  lligar("btnRetirar", retirarSe);
  lligar("btnSeguent", seguentPregunta);
}
function lligar(id, fn) {
  var el = document.getElementById(id);
  if (el) el.addEventListener("click", fn);
}

function renderFinal(victoria) {
  var titol, text;
  var vaFallar = estat.confirmat && estat.triada !== null && estat.triada !== preguntaActual().c;
  if (vaFallar) {
    titol = "🛑 Resposta incorrecta";
    text = "S'ha marxat amb el premi assegurat: <strong>" + formatEuro(estat.guany) + "</strong>";
  } else if (victoria && estat.guany === PREMIS[14]) {
    titol = "🎉 GRAN PREMI FINAL!";
    text = "Ha guanyat el milió: <strong>" + formatEuro(PREMIS[14]) + "</strong>";
  } else {
    titol = "🏳️ S'ha aturat a temps";
    text = "Es marxa amb: <strong>" + formatEuro(estat.guany) + "</strong>";
  }
  app.innerHTML =
    '<h1>¿Quién quiere ser Leonardo?<small>' + escapar(NOMS_CONCURSANTS[estat.concursant]) + '</small></h1>' +
    '<div class="resultat-final"><h2>' + titol + '</h2><p>' + text + '</p></div>' +
    '<div class="botons-menu">' +
      '<button class="btn" data-accio="tornar-inici">↻ Tornar al menú per al següent concursant</button>' +
      '<button class="btn secundari" data-accio="repetir-concursant">A jugar una altra vegada</button>' +
    '</div>';
}

function renderAjuda() {
  app.innerHTML =
    '<h1>Com es juga</h1><div class="ajuda"><ul>' +
    '<li><strong>15 preguntes</strong> d\'escalada de dificultat. A les preguntes <strong>5 (1.000 €)</strong> i <strong>10 (15.000 €)</strong> el premi queda assegurat: si falles després, surts amb aquesta quantitat.</li>' +
    '<li><strong>Modo presentador:</strong> escolta la resposta que diu en veu alta el concursant, fes un clic sobre la opció per marcar-la i prem «Confirmar». Amb el botó 👁️ pots veure (o amagar) la correcta, i tu fas el comodí 50:50.</li>' +
    '<li><strong>Modo concursant:</strong> l\'alumne juga a la pantalla i no veu mai la solució fins que no confirma.</li>' +
    '<li><strong>Comodí 50:50:</strong> desapareixen dues respostes incorrectes (si ja n\'hi ha una marcada, se\'n manté i s\'esborren les altres dues dolentes).</li>' +
    '<li><strong>Comodí del públic 👥:</strong> la classe vota a mà alçada; s\'apunten els vots i la app dibuixa el gràfic de percentatges.</li>' +
    '<li><strong>Comodí de Google ⏱️:</strong> compte enrere de 30 segons per cercar a Internet.</li>' +
    '<li><strong>Aturar-se 🏳️:</strong> en qualsevol moment abans de confirmar es pot marxar amb el premi acumulat.</li>' +
    '<li><strong>Editor de preguntes:</strong> a dins pots afegir, editar, esborrar i importar/exportar les preguntes dels 3 concursants.</li>' +
    '</ul><div class="tornar"><button class="btn" data-accio="tornar-inici">⬅ Tornar al menú</button></div></div>';
}

/* ---------------- EDITOR ---------------- */
function renderEditor() {
  var n = editorEstat.concursant;
  var llista = preguntesDe(n);
  var pestanyes = NOMS_CONCURSANTS.map(function (nom, i) {
    return '<button class="btn secundari btn-petit" data-accio="editor-concursant" data-n="' + i + '"' +
      (i === n ? ' style="border-color:var(--or)"' : '') + '>' + nom + ': ' + preguntesDe(i).length + '/15</button>';
  }).join("");
  var html = '<h1>Editor de preguntes<small>' + escapar(NOMS_CONCURSANTS[n]) + '</small></h1>' +
    '<div class="editor-zona"><div class="fila">' + pestanyes + '</div>';
  if (!preguntesPerConcursant["c" + (n + 1)]) {
    html += '<div class="aviso">Aquest concursant té de sèrie les 15 preguntes del guion. Les edicions es queden desades al navegador d\'aquest ordinador (no modifiquen l\'index.html): feu «Descarregar còpia» per tenir-les en un fitxer i portar-les a qualsevol altre ordinador.</div>';
  }
  llista.forEach(function (q, i) {
    html += '<div class="item-pregunta"><span><strong>' + (i + 1) + '.</strong> ' + escapar(q.p) +
      ' <em>(✓ ' + LLETRES[q.c] + ')</em></span>' +
      '<button class="btn secundari btn-petit" data-accio="editar-p" data-n="' + i + '">Editar</button>' +
      '<button class="btn perill btn-petit" data-accio="esborrar-p" data-n="' + i + '">✕</button></div>';
  });
  if (llista.length < 15) {
    html += '<div class="fila" style="margin:12px 0;"><button class="btn" data-accio="afegir-p">＋ Afegir pregunta ' + (llista.length + 1) + '</button></div>';
  }
  html += '<div class="fila" style="margin-top:16px;">' +
    '<button class="btn secundari btn-petit" data-accio="exportar">⬇️ Descarregar còpia de les preguntes (fitxer .json)</button>' +
    '<label class="btn secundari btn-petit">⬆️ Carregar un fitxer .json' +
      '<input type="file" id="fitxerImport" accept=".json,.txt" style="display:none;">' +
    '</label>' +
    '<button class="btn secundari btn-petit" data-accio="importar">📋 Importar enganxant text (JSON)</button>' +
    '</div><div id="zonaImport"></div>' +
    '<div class="tornar"><button class="btn" data-accio="tornar-inici">⬅ Tornar al menú</button></div></div>';
  app.innerHTML = html;
  var fitxerImport = document.getElementById("fitxerImport");
  if (fitxerImport) fitxerImport.addEventListener("change", function () {
    carregarFitxerImport(fitxerImport.files[0]);
  });
}

function renderEdicioPregunta() {
  var n = editorEstat.concursant;
  var llista = preguntesDe(n);
  var esNova = editorEstat.index === null;
  var q = esNova ? { p:"", o:["","","",""], c:0 } : llista[editorEstat.index];
  var html = '<h1>' + (esNova ? 'Nova pregunta ' + (llista.length + 1) : 'Editar pregunta ' + (editorEstat.index + 1)) +
    '<small>' + escapar(NOMS_CONCURSANTS[n]) + '</small></h1><div class="editor-zona">' +
    '<label>Enunciat:</label><input class="camp" id="campPregunta" value="' + escapar(q.p) + '">';
  LLETRES.forEach(function (l, i) {
    html += '<label><input type="radio" class="radio-correcta" name="radiocorrecta" value="' + i + '"' +
      (q.c === i ? ' checked' : '') + '> Resposta ' + l + ' — marca aquí si és la correcta:</label>' +
      '<input class="camp" data-opt="' + i + '" value="' + escapar(q.o[i] || "") + '">';
  });
  html += '<div class="fila" style="margin-top:16px;">' +
    '<button class="btn" id="btnGuardarP">💾 Desar</button>' +
    '<button class="btn secundari" id="btnCancelarP">Cancel·lar</button></div></div>';
  app.innerHTML = html;

  document.getElementById("btnGuardarP").addEventListener("click", function () {
    var p = document.getElementById("campPregunta").value.trim();
    var opts = [];
    var c = 0;
    var optsEls = document.querySelectorAll("[data-opt]");
    var radios = document.querySelectorAll("input[name='radiocorrecta']");
    optsEls.forEach(function (inp, i) {
      opts.push(inp.value.trim());
      if (radios[i].checked) c = i;
    });
    if (!p || opts.some(function (o) { return !o; })) {
      alert("Cal omplir l'enunciat i les quatre respostes.");
      return;
    }
    if (esNova) llista.push({ p:p, o:opts, c:c });
    else llista[editorEstat.index] = { p:p, o:opts, c:c };
    if (n === 0) preguntesPerConcursant.c1 = llista;
    else if (n === 1) preguntesPerConcursant.c2 = llista;
    else preguntesPerConcursant.c3 = llista;
    guardarPreguntes();
    estat.vista = "editor";
    renderitzar();
  });
  document.getElementById("btnCancelarP").addEventListener("click", function () {
    estat.vista = "editor";
    renderitzar();
  });
}

function aplicarImport(dades) {
  var esLlistaValida = function (a) {
    return Array.isArray(a) && a.every(function (q) {
      return q && typeof q.p === "string" && Array.isArray(q.o) && q.o.length === 4
        && typeof q.c === "number" && q.c >= 0 && q.c <= 3;
    });
  };
  var carregades = 0;
  if (esLlistaValida(dades.c1)) { preguntesPerConcursant.c1 = dades.c1; carregades++; }
  if (esLlistaValida(dades.c2)) { preguntesPerConcursant.c2 = dades.c2; carregades++; }
  if (esLlistaValida(dades.c3)) { preguntesPerConcursant.c3 = dades.c3; carregades++; }
  if (!carregades) { alert("El fitxer no té preguntes vàlides."); return; }
  guardarPreguntes();
  estat.missatge = "Preguntes importades correctament!";
  estat.vista = "inici";
  renderitzar();
}

function carregarFitxerImport(fitxer) {
  if (!fitxer) return;
  var lector = new FileReader();
  lector.onload = function () {
    try { aplicarImport(JSON.parse(lector.result)); }
    catch (e) { alert("El fitxer no és un JSON vàlid."); }
  };
  lector.readAsText(fitxer);
}

function exportarPreguntes() {
  var dades = { c1: preguntesDe(0), c2: preguntesDe(1), c3: preguntesDe(2) };
  var contingut = JSON.stringify(dades, null, 1);
  try {
    var blob = new Blob([contingut], { type: "application/json" });
    var enllac = document.createElement("a");
    enllac.href = URL.createObjectURL(blob);
    enllac.download = "preguntes-leonardo.json";
    document.body.appendChild(enllac);
    enllac.click();
    document.body.removeChild(enllac);
    setTimeout(function () { URL.revokeObjectURL(enllac.href); }, 1000);
  } catch (e) {
    document.getElementById("zonaImport").innerHTML =
      '<label>Copia aquest text i guarda\'l en un fitxer:</label>' +
      '<textarea class="camp" rows="8" readonly onclick="this.select()">' + escapar(contingut) + '</textarea>';
  }
}
function importarPreguntes() {
  var zona = document.getElementById("zonaImport");
  if (zona.getAttribute("data-obert") === "1") return;
  zona.setAttribute("data-obert", "1");
  zona.innerHTML = '<label style="margin-top:12px;">Pega aquí el text JSON exportat abans:</label>' +
    '<textarea class="camp" id="textImport" rows="8"></textarea>' +
    '<div class="fila"><button class="btn" id="btnFerImport">Importar</button></div>';
  document.getElementById("btnFerImport").addEventListener("click", function () {
    var dades;
    try { dades = JSON.parse(document.getElementById("textImport").value); }
    catch (e) { alert("El text no és un JSON vàlid."); return; }
    aplicarImport(dades);
  });
}

/* ---------------- ESDEVENIMENTS ---------------- */
app.addEventListener("click", function (e) {
  var btn = e.target.closest("[data-accio]");
  if (!btn) return;
  var accio = btn.getAttribute("data-accio");
  if (accio === "escollir-mode") {
    estat.mode = btn.getAttribute("data-mode");
    estat.missatge = "";
    var menu = document.getElementById("menuConcursant");
    if (menu) menu.style.display = "block";
  } else if (accio === "escollir-concursant") {
    estat.concursant = parseInt(btn.getAttribute("data-n"), 10);
    if (estat.mode === null) estat.mode = "presentador";
    iniciarJoc();
  } else if (accio === "anar-editor") {
    estat.vista = "editor"; estat.missatge = ""; renderitzar();
  } else if (accio === "anar-ajuda") {
    estat.vista = "ajuda"; estat.missatge = ""; renderitzar();
  } else if (accio === "tornar-inici") {
    estat.vista = "inici"; estat.missatge = ""; renderitzar();
  } else if (accio === "repetir-concursant") {
    iniciarJoc();
  } else if (accio === "editor-concursant") {
    editorEstat.concursant = parseInt(btn.getAttribute("data-n"), 10);
    renderitzar();
  } else if (accio === "editar-p") {
    editorEstat.index = parseInt(btn.getAttribute("data-n"), 10);
    estat.vista = "edicio-pregunta"; renderitzar();
  } else if (accio === "afegir-p") {
    editorEstat.index = null;
    estat.vista = "edicio-pregunta"; renderitzar();
  } else if (accio === "esborrar-p") {
    var i = parseInt(btn.getAttribute("data-n"), 10);
    if (confirm("Segur que voleu esborrar la pregunta " + (i + 1) + "?")) {
      var llista = preguntesDe(editorEstat.concursant);
      llista.splice(i, 1);
      if (editorEstat.concursant === 0) preguntesPerConcursant.c1 = llista;
      else if (editorEstat.concursant === 1) preguntesPerConcursant.c2 = llista;
      else preguntesPerConcursant.c3 = llista;
      guardarPreguntes();
      renderitzar();
    }
  } else if (accio === "exportar") {
    exportarPreguntes();
  } else if (accio === "importar") {
    importarPreguntes();
  }
});

(function () {
  var panell = document.getElementById("panellPubli");
  var nansa = document.getElementById("panellPubliCap");
  var arrossegant = false, offX = 0, offY = 0;
  function inici(e) {
    if (panell.classList.contains("ocult")) return;
    var punts = e.touches ? e.touches[0] : e;
    var rect = panell.getBoundingClientRect();
    offX = punts.clientX - rect.left;
    offY = punts.clientY - rect.top;
    arrossegant = true;
    if (e.cancelable) e.preventDefault();
  }
  function moure(e) {
    if (!arrossegant) return;
    var punts = e.touches ? e.touches[0] : e;
    panell.style.left = (punts.clientX - offX) + "px";
    panell.style.top = (punts.clientY - offY) + "px";
    panell.style.right = "auto";
    if (e.cancelable) e.preventDefault();
  }
  function fi() { arrossegant = false; }
  nansa.addEventListener("mousedown", inici);
  nansa.addEventListener("touchstart", inici, {passive:true});
  document.addEventListener("mousemove", moure);
  document.addEventListener("touchmove", moure, {passive:false});
  document.addEventListener("mouseup", fi);
  document.addEventListener("touchend", fi);
})();

document.getElementById("btnPubliFer").addEventListener("click", ferGraficPublic);
document.getElementById("btnPubliTancar").addEventListener("click", function () {
  document.getElementById("panellPubli").classList.add("ocult");
});
